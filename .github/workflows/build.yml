name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}-${{ inputs.device }}-${{ inputs.target_os }}-${{ inputs.ksu }}
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python3 \
          python-is-python3 cpio libelf-dev

    - name: Validate Build Helpers
      run: |
        bash -n build_kernel.sh
        python3 -m unittest discover -s scripts/tests -v
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-clang16-ccache-${{ inputs.device }}-${{ inputs.target_os }}-${{ inputs.ksu }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-clang16-ccache-${{ inputs.device }}-${{ inputs.target_os }}-${{ inputs.ksu }}-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        curl --fail --location --retry 5 --connect-timeout 30 \
          https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz \
          --output clang.tar.gz
        tar -xzf clang.tar.gz
        ./bin/clang --version

    - name: Run Build Script
      env:
        DEVICE: ${{ inputs.device }}
        ENABLE_KSU: ${{ inputs.ksu }}
        TARGET_OS: ${{ inputs.target_os }}
      run: |
        set -o pipefail
        mkdir -p logs
        args=("$DEVICE")
        if [ "$ENABLE_KSU" = "true" ]; then
          args+=(ksu)
        fi
        if [ "$TARGET_OS" != "both" ]; then
          args+=("$TARGET_OS")
        fi
        bash build_kernel.sh "${args[@]}" 2>&1 | tee logs/build.log

    - name: Upload Build Diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: diagnostics-${{ inputs.device }}-${{ github.run_id }}
        include-hidden-files: true
        path: |
          logs/
          out_*/.config
          out_*/include/config/kernel.release
          out_*/include/generated/compile.h
          anykernel/build-info.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: |
          APTKernel_*.zip
          APTKernel_*.zip.sha256
        if-no-files-found: error
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩
